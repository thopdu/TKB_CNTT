# Cấu hình Nginx cho tên miền: tkb.pvantho.id.vn
# Đặt file này vào: /etc/nginx/sites-available/tkb.pvantho.id.vn
# Sau đó liên kết: sudo ln -s /etc/nginx/sites-available/tkb.pvantho.id.vn /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name tkb.pvantho.id.vn;

    # Tự động chuyển hướng toàn bộ HTTP sang HTTPS an toàn
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tkb.pvantho.id.vn;

    # SSL Certificate (Được cấu hình tự động bởi Certbot: sudo certbot --nginx -d tkb.pvantho.id.vn)
    # ssl_certificate /etc/letsencrypt/live/tkb.pvantho.id.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tkb.pvantho.id.vn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Giới hạn dung lượng tải lên (hỗ trợ nhập file Excel/PDF TKB dung lượng lớn)
    client_max_body_size 100M;

    # Bật nén Gzip tối ưu tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy toàn bộ traffic vào Node.js / Express Server (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache tài nguyên tĩnh (assets, fonts, images) để tăng tốc độ tải
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
